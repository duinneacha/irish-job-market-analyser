name: Nightly Job Scraper

on:
  schedule:
    # Runs at 06:00 UTC every day (07:00 Irish time, before most people start job hunting)
    - cron: "0 6 * * *"
  workflow_dispatch:   # Also allows manual trigger from GitHub Actions UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python run_scraper.py --max-pages 15
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit updated database
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/jobs.db
          git diff --staged --quiet || git commit -m "chore: nightly scrape $(date -u '+%Y-%m-%d')"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
